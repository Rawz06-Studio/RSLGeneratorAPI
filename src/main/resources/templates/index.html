<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSL Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 to-gray-800 min-h-screen">
    <div class="container mx-auto px-4 py-12">
        <div class="max-w-2xl mx-auto">
            <!-- Header -->
            <div class="text-center mb-12">
                <h1 class="text-4xl font-bold text-white mb-4">RSL Generator</h1>
                <p class="text-gray-300 text-lg">Generate your RSL settings easily</p>
            </div>

            <!-- Main Card -->
            <div class="bg-gray-800 rounded-lg shadow-2xl p-8 border border-gray-700">
                <div class="mb-8">
                    <label for="preset" class="block text-sm font-medium text-gray-300 mb-3">
                        Select a preset
                    </label>
                    <select id="preset" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 text-white rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition">
                        <option value="">-- Choose a preset --</option>
                    </select>
                </div>

                <!-- Loading State -->
                <div id="loading" class="hidden mb-6 p-4 bg-blue-900 border border-blue-700 rounded-lg">
                    <div class="flex items-center">
                        <div class="animate-spin h-5 w-5 text-blue-400 mr-3">
                            <svg class="animate-spin h-5 w-5 text-blue-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </div>
                        <span class="text-blue-300">Generating...</span>
                    </div>
                </div>

                <!-- Error State -->
                <div id="error" class="hidden mb-6 p-4 bg-red-900 border border-red-700 rounded-lg">
                    <p class="text-red-300 text-sm"><span class="font-semibold">Error:</span> <span id="error-message"></span></p>
                </div>

                <!-- Success State -->
                <div id="success" class="hidden mb-6 p-4 bg-green-900 border border-green-700 rounded-lg">
                    <div class="flex items-center justify-between">
                        <p class="text-green-300">✓ File generated successfully</p>
                        <button id="download-btn" type="button" class="ml-4 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition font-medium">
                            Download
                        </button>
                    </div>
                </div>

                <!-- Generate Button -->
                <button id="generate-btn" type="button" class="w-full px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
                    Generate
                </button>
            </div>

            <!-- Info Section -->
            <div id="presets-info" class="mt-12 grid grid-cols-1 md:grid-cols-2 gap-6">
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-gray-400 text-sm mt-12">
        <p>RSL Generator <span th:text="${version}">v1.0.0</span></p>
    </footer>

    <script th:inline="javascript">
        const presetSelect = document.getElementById('preset');
        const generateBtn = document.getElementById('generate-btn');
        const loadingDiv = document.getElementById('loading');
        const errorDiv = document.getElementById('error');
        const successDiv = document.getElementById('success');
        const errorMessage = document.getElementById('error-message');
        const downloadBtn = document.getElementById('download-btn');
        const presetsInfoDiv = document.getElementById('presets-info');
        let generatedData = null;

        const presets = [[${presets}]];

        generateBtn.addEventListener('click', generateSettings);
        downloadBtn.addEventListener('click', downloadFile);

        // Load presets on page load
        document.addEventListener('DOMContentLoaded', loadPresets);

        function loadPresets() {
            // Populate select dropdown
            presets.forEach(preset => {
                const option = document.createElement('option');
                option.value = preset.name;
                option.textContent = preset.name;
                presetSelect.appendChild(option);
            });

            // Display preset info
            presetsInfoDiv.innerHTML = presets.map(preset => `
                <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                    <h3 class="text-white font-semibold mb-2">${preset.name}</h3>
                    <p class="text-gray-400 text-sm">Preset: ${preset.name}</p>
                </div>
            `).join('');
        }

        async function generateSettings() {
            const preset = presetSelect.value;

            if (!preset) {
                showError('Please select a preset');
                return;
            }

            // Reset states
            hideAllStates();
            loadingDiv.classList.remove('hidden');
            generateBtn.disabled = true;

            try {
                const response = await fetch(`/api/rsl/${preset}`);
                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }

                generatedData = await response.json();
                showSuccess();
            } catch (error) {
                showError(error.message);
            } finally {
                loadingDiv.classList.add('hidden');
                generateBtn.disabled = false;
            }
        }

        function downloadFile() {
            if (!generatedData) return;

            const dataStr = JSON.stringify(generatedData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `rsl-settings-${presetSelect.value.toLowerCase()}-${Date.now()}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function hideAllStates() {
            loadingDiv.classList.add('hidden');
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');
        }

        function showError(message) {
            hideAllStates();
            errorMessage.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        function showSuccess() {
            hideAllStates();
            successDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
