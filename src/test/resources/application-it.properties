# Integration Test Configuration
# Override properties to use a fake shell script instead of real Python

# Use bash to run the fake script
app.python.command=bash

# Point to the fake script location (will be set by @TempDir in the test)
# The actual path is dynamically set, but we need a valid property
app.python.script.dir=.

# Use our fake script
app.python.script.name=generate_settings.sh

# Use valid weight file paths (they won't be used since our script doesn't require them)
app.python.weights.rsl=weights/rsl_season7.json
app.python.weights.rot=weights/rsl_rot.json
